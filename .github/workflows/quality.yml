name: Quality

on:
  pull_request:
  push:
    branches: [main]

# This workflow never deploys and receives only the repository-read permission.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node@v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix mobile ci
      - run: npm run format:check
      - name: Build backend production output
        run: npm --prefix backend run build
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Build frontend production output
        run: npm --prefix frontend run build
      # actions/upload-artifact@v4
      - name: Retain compiled release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alalay-build-output
          path: |
            backend/dist
            frontend/dist
          if-no-files-found: error
          retention-days: 7
      - name: Type-check mobile
        run: npm --prefix mobile run typecheck
      - run: npm --prefix mobile run lint
      - run: npm run scan:encoding
      - run: npm --prefix mobile run test:budget-setup
      - run: npm run test:contracts
      - run: npm run test:workflows
        env:
          # Workflow tests are pure contract/unit tests; never start or configure
          # the credentialed notification scheduler in CI.
          NOTIFICATION_SCHEDULER_ENABLED: 'false'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix backend audit --omit=dev --audit-level=high
      - run: npm --prefix frontend audit --omit=dev --audit-level=high
      - run: npm --prefix mobile audit --omit=dev --audit-level=high

  database:
    name: Database migrations and SQL/RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node@v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # supabase/setup-cli@v3.0.0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.99.0
      - name: Verify local Docker and Supabase CLI prerequisites
        run: |
          docker version
          supabase --version
      - name: Start an isolated local Supabase database
        run: supabase db start
      - name: Apply migrations from a clean local state
        run: supabase db reset --local
      - name: Select the local Supabase database container
        id: database-container
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(
            docker ps \
              --filter 'label=com.supabase.cli.project=alalay' \
              --format '{{.Names}}' |
              grep '^supabase_db_' || true
          )

          if [ "${#containers[@]}" -ne 1 ]; then
            echo "Expected exactly one running Supabase database container for project alalay; found ${#containers[@]}." >&2
            docker ps -a --filter 'label=com.supabase.cli.project=alalay' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' >&2
            exit 1
          fi

          echo "container=${containers[0]}" >> "$GITHUB_OUTPUT"
      - name: Run SQL and RLS regression tests
        run: npm run test:db
        env:
          SUPABASE_DB_CONTAINER: ${{ steps.database-container.outputs.container }}
      - name: Diagnose local Supabase failure
        if: failure()
        shell: bash
        run: |
          set +e
          redact() {
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's/^([[:space:]]*.*(password|secret|token|api[ _-]?key|jwt).*[=:][[:space:]]*).*/\1[REDACTED]/I'
          }

          echo 'Supabase status (sensitive values redacted):'
          supabase status 2>&1 | redact
          echo 'Relevant containers:'
          docker ps -a --filter 'label=com.supabase.cli.project=alalay' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo 'Relevant container logs (sensitive values redacted):'
          docker ps -a --filter 'label=com.supabase.cli.project=alalay' --format '{{.Names}}' | while IFS= read -r container; do
            echo "--- ${container} ---"
            docker logs --tail 200 "$container" 2>&1 | redact
          done
      - name: Stop isolated local Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5; full history allows the scanner to inspect commits.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
